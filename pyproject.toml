[project]
name = "mb"
version = "0.1.0"
description = "Multibagger v2: NSE research and trading system"
authors = [
    { name = "Rohan Ahire", email = "rohanahire1607@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "polars>=1.44.2",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "typer>=0.27.2",
]

[project.scripts]
mb = "mb.cli:app"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "optuna>=5.0.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
