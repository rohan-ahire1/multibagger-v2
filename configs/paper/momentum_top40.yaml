# M8 second paper book (docs/research/m8.md): vol-adjusted momentum holding 40 names, the one momentum-m8 variant that
# passed on the development period (run 20260929-065335-1df714a6). No final run on the spent test window; this forward
# book is its test. Runs beside momentum_voladj, which it does not replace. Params and market costs come from the
# strategy config, pinned by its resolved hash; its dataset and period are not used.
name: momentum_top40
strategy_config: strategies/momentum/configs/m8_top40_dev_d.yaml
strategy_config_hash: 1df714a673b1499798612abe4958b77268056da7385191319c68de20d860860a
data_config: configs/data/nse_daily.yaml
start: 2026-09-30
initial_capital: 1000000
keep_datasets: 3
# Today's file is often not out at the first run of the evening; two missing sessions means the feed is stuck.
max_missing_sessions: 1
replay_max_equity_gap_pct: 2.0
calendar:
  url: https://www.nseindia.com/api/holiday-master?type=trading
  segment: CM
  raw_dir: data/raw/nse_holidays
  timeout_s: 30
alerts:
  ntfy_url: https://ntfy.sh
  topic_env: MB_NTFY_TOPIC
  heartbeat_weekday: 4
