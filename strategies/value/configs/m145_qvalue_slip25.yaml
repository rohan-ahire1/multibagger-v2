# M145 (docs/research/m145.md): quality value book, M144 restricted to names profitable in each of the last four quarters with growing trailing profit, 25 bps extra slippage
name: value
version: m145_qvalue_slip25
dataset: nse_research@2026-10-25
market: nse_cash_slip25
period: {start: 2010-01-04, end: 2023-12-31}
params:
  universe:
    allowed_series: [EQ]
    min_price_inr: 50
    min_adv_inr: 10000000
    adv_window_sessions: 50
    exclude_fund_units: true
  results_raw_dir: data/raw/nse_results
  max_age_days: 200
  score: earnings_yield
  top_n: 25
  decision_offset_sessions: 0
  initial_capital: 1000000
  quality: stable_growth
