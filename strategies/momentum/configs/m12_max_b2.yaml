# M12 (docs/research/m12.md), book 2 (40 names, reference m8_top40_stocks_dev_f): drop the top 10% of names by largest one-day return over 21 sessions (Bali, Cakici & Whitelaw 2011).
name: momentum
version: m12_max_b2
dataset: nse_research@2026-09-29f
market: nse_cash
period: {start: 2010-01-04, end: 2023-12-31}
params:
  universe:
    allowed_series: [EQ]
    min_price_inr: 50
    min_adv_inr: 50000000
    adv_window_sessions: 50
    exclude_fund_units: true
  ranking:
    lookback_sessions: 252
    skip_sessions: 21
    score: return_over_vol
    second_lookback_sessions: null
    high_window_sessions: null
    residual_beta_sessions: null
    residual_benchmark_symbol: NIFTYBEES
    frog_candidates_per_slot: null
    max_filter_frac: 0.1
    max_window_sessions: 21
  portfolio:
    top_n: 40
    hold_rank_max: 40
    resize_held: true
    max_per_sector: null
    weighting: equal
    inverse_vol_sessions: 126
    min_momentum: null
  regime:
    enabled: false
    benchmark_symbol: NIFTYBEES
    sma_sessions: 200
    risk_off_gross: 0.0
  sizing:
    vol_target_annual: null
    vol_benchmark_symbol: NIFTYBEES
    vol_window_sessions: 63
  schedule:
    decision_offset_sessions: 0
  exits:
    stop_loss_frac: null
  initial_capital: 1000000
