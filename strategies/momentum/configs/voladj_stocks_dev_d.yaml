# Paper book 1 from 2026-09-30: voladj_final's params with fund units excluded (stocks only). Vol-adjusted ranking put
# liquid and money-market ETFs at the top of the 2026-09-28 preview (8 of 30 picks). Dev period on dataset d.
name: momentum
version: voladj_stocks_dev_d
dataset: nse_research@2026-09-29d
market: nse_cash
period: {start: 2010-01-04, end: 2023-12-31}
params:
  universe:
    allowed_series: [EQ]
    min_price_inr: 50
    min_adv_inr: 50000000
    adv_window_sessions: 50
    exclude_fund_units: true
  ranking:
    lookback_sessions: 252
    skip_sessions: 21
    score: return_over_vol
  portfolio:
    top_n: 30
    hold_rank_max: 30
  regime:
    enabled: false
    benchmark_symbol: NIFTYBEES
    sma_sessions: 200
    risk_off_gross: 0.0
  initial_capital: 1000000
