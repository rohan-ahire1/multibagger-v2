# M29 (docs/research/m29.md): m19_gold20_invvol_b2 holding the 40 least volatile liquid stocks (one-year daily vol) instead of momentum.
name: momentum
version: m29_lowvol_gold20_b2
dataset: nse_research@2026-09-30c
market: nse_cash
period: {start: 2010-01-04, end: 2023-12-31}
params:
  universe:
    allowed_series: [EQ]
    min_price_inr: 50
    min_adv_inr: 50000000
    adv_window_sessions: 50
    exclude_fund_units: true
    fund_units_by_symbol: true
  ranking:
    lookback_sessions: 252
    skip_sessions: 0
    score: return_over_vol
    second_lookback_sessions: null
    high_window_sessions: null
    residual_beta_sessions: null
    residual_benchmark_symbol: NIFTYBEES
    frog_candidates_per_slot: null
    max_filter_frac: null
    max_window_sessions: 21
    order: low_vol
  portfolio:
    top_n: 40
    hold_rank_max: 40
    resize_held: true
    max_per_sector: null
    weighting: inverse_vol
    inverse_vol_sessions: 126
    min_momentum: null
    fixed_weights: {GOLDBEES: 0.20}
    fixed_trend_sessions: null
    rotation: null
  regime:
    enabled: false
    benchmark_symbol: NIFTYBEES
    sma_sessions: 200
    risk_off_gross: 0.0
  sizing:
    vol_target_annual: null
    vol_benchmark_symbol: NIFTYBEES
    vol_window_sessions: 63
  schedule:
    decision_offset_sessions: 0
  exits:
    stop_loss_frac: null
    book_stop_frac: null
  initial_capital: 1000000
